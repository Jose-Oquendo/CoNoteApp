services:
  # -------------------------------------------------------------------
  # 1. AWS SAM Local: Emulación de la función Lambda en puerto 3001
  # -------------------------------------------------------------------
  sam-local:
    build:
      context: .
      dockerfile: Dockerfile.sam
    container_name: conote-sam-local
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: sam local start-api -p 3001 --host 0.0.0.0 --skip-pull-image
    networks:
      - webnet

  # -------------------------------------------------------------------
  # 2. Servidor Backend Express: API REST de Usuarios, Notas y Auth
  # -------------------------------------------------------------------
  server:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: conote-server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - ./server/data:/app/data
      - /app/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
      - SAM_LOCAL_URL=http://sam-local:3001/metrics
    depends_on:
      - sam-local
    networks:
      - webnet

  # -------------------------------------------------------------------
  # 3. Cliente Frontend React: Interfaz del Tablero y Dashboard
  # -------------------------------------------------------------------
  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: conote-client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_PORT=3000
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - server
    networks:
      - webnet

# -------------------------------------------------------------------
# Red aislada para comunicación entre servicios
# -------------------------------------------------------------------
networks:
  webnet:
    name: conote_webnet
    driver: bridge